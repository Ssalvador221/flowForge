name: flowforge

services:
  postgres:
    image: postgres:17-alpine
    container_name: flowforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies every pending migration in ./migrations, then exits.
  # Runs automatically on `docker compose up`; re-run with `make migrate-up`.
  migrate:
    image: migrate/migrate:v4.18.3
    container_name: flowforge-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD:-flowforge}@postgres:5432/${POSTGRES_DB:-flowforge}?sslmode=disable"
      - "up"
    restart: "no"

  # Code generator, only started on demand: `docker compose run --rm sqlc generate`.
  sqlc:
    image: sqlc/sqlc:1.31.1
    container_name: flowforge-sqlc
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - ./:/src
    command: ["generate"]

volumes:
  postgres-data:
